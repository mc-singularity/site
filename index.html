<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singularity - Приватный сервер КМ(Контент Мэйкеров)</title>
    <style>
        :root {
            --accent-color: #ffffff;
            --accent-dim: rgba(255, 255, 255, 0.1);
            --accent-hover: rgba(255, 255, 255, 0.2);
            --accent-shadow: rgba(255, 255, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'uvKits';
            src: url('uvKits.ttf') format('truetype');
            font-display: swap;
        }

        /* Принудительное наследование шрифта uvKits всеми кнопками, ссылками и инпутами */
        button, input, select, textarea, a, .button {
            font-family: 'uvKits', sans-serif !important;
        }

        /* Кастомный курсор только для ПК */
        @media (hover: hover) and (pointer: fine) {
            * {
                cursor: none !important;
            }
        }

        body {
            font-family: 'uvKits', sans-serif;
            color: #ffffff;
            background: #000000;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Выплывающая панель переключения темы под логотипом */
        .theme-switcher-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: rgba(0, 0, 0, 0.9);
            border: 0px solid var(--accent-color);
            padding: 0 0.8rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.9);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin: 0 auto;
            width: max-content;
            max-width: 90vw;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px) scale(0.95);
            max-height: 0;
            overflow: hidden;
            z-index: 100;
        }

        .theme-switcher-container.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
            max-height: 200px;
            padding: 0.5rem 0.8rem;
            border-width: 2px;
            margin-top: 1rem;
        }

        .theme-switcher-label {
            font-size: 0.75rem;
            font-family: 'uvKits', sans-serif !important;
            color: var(--accent-color);
            letter-spacing: 0.05rem;
            transition: color 0.3s ease;
        }

        .theme-options {
            display: flex;
            gap: 0.35rem;
            flex-wrap: nowrap;
        }

        .theme-swatch {
            width: 0.95rem;
            height: 0.95rem;
            border: 1px solid #000000;
            outline: 1px solid #555555;
            cursor: pointer;
            transition: transform 0.15s ease, outline-color 0.15s ease;
            image-rendering: pixelated;
        }

        .theme-swatch:hover, .theme-swatch.active {
            transform: scale(1.25);
            outline-color: #ffffff;
        }

        /* Полноэкранный Ретро Экран Загрузки */
        .retro-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            z-index: 9999999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s ease;
        }

        .retro-loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-logo {
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-family: 'uvKits', sans-serif !important;
            color: var(--accent-color);
            text-shadow: 0.2rem 0.2rem 0 #000000, -2px -2px 0 #333333;
            letter-spacing: 0.25rem;
            animation: retroGlitch 2s infinite alternate;
        }

        .loader-bar-container {
            width: 80%;
            max-width: 22rem;
            height: 1.5rem;
            background: #111111;
            border: 3px solid var(--accent-color);
            padding: 2px;
            box-shadow: 4px 4px 0px #000000;
            position: relative;
        }

        .loader-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-color);
            transition: width 0.15s steps(10, end);
            box-shadow: inset -2px -2px 0px #888888;
        }

        .loader-status {
            font-size: clamp(0.85rem, 2vw, 1.1rem);
            font-family: 'uvKits', sans-serif !important;
            color: #aaaaaa;
            text-shadow: 1px 1px 0 #000000;
            min-height: 1.5rem;
            text-align: center;
            padding: 0 1rem;
        }

        .loader-percent {
            font-size: 1.2rem;
            color: #ffff55;
            font-family: 'uvKits', sans-serif !important;
            text-shadow: 1px 1px 0 #000000;
        }

        /* Анимации появления категорий */
        .reveal-item {
            opacity: 0;
            transform: translateY(20px) scale(0.98);
            transition: opacity 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            will-change: opacity, transform;
        }

        body.loaded .reveal-item {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        body.loaded header.reveal-item                  { transition-delay: 0.2s; }
        body.loaded .section.server-status.reveal-item   { transition-delay: 0.35s; }
        body.loaded .section.social-links.reveal-item    { transition-delay: 0.5s; }
        body.loaded .section.team-section.reveal-item    { transition-delay: 0.65s; }
        body.loaded .section.media-section.reveal-item   { transition-delay: 0.75s; }
        body.loaded footer.reveal-item                   { transition-delay: 0.9s; }

        .panel-toggle.reveal-item {
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.4s ease, background 0.2s ease, border-color 0.3s ease, color 0.3s ease;
        }
        .panel-toggle.left.reveal-item  { transform: translateX(-30px); }
        .panel-toggle.right.reveal-item { transform: translateX(30px); }

        @media (min-width: 48.01rem) {
            .panel-toggle.left.reveal-item  { transform: translateY(-50%) translateX(-30px); }
            .panel-toggle.right.reveal-item { transform: translateY(-50%) translateX(30px); }
        }

        body.loaded .panel-toggle.left.reveal-item {
            opacity: 1;
            transform: translateX(0);
            transition-delay: 0.15s;
        }
        body.loaded .panel-toggle.right.lore.reveal-item {
            opacity: 1;
            transform: translateX(0);
            transition-delay: 0.25s;
        }
        body.loaded .panel-toggle.right.events.reveal-item {
            opacity: 1;
            transform: translateX(0);
            transition-delay: 0.35s;
        }

        @media (min-width: 48.01rem) {
            body.loaded .panel-toggle.left.reveal-item { transform: translateY(-50%) translateX(0); }
            body.loaded .panel-toggle.right.lore.reveal-item { transform: translateY(-50%) translateX(0); }
            body.loaded .panel-toggle.right.events.reveal-item { transform: translateY(-50%) translateX(0); }
        }

        .social-button.reveal-sub {
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        body.loaded .social-button.reveal-sub:nth-child(1) { transition-delay: 0.55s; opacity: 1; transform: scale(1); }
        body.loaded .social-button.reveal-sub:nth-child(2) { transition-delay: 0.65s; opacity: 1; transform: scale(1); }
        body.loaded .social-button.reveal-sub:nth-child(3) { transition-delay: 0.75s; opacity: 1; transform: scale(1); }

        /* Стилизация пиксельного скроллбара */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #000000;
            border-left: 1px solid #333333;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-color);
            border-radius: 0px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #cccccc;
        }

        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none !important;
            z-index: 99999;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            opacity: 0.5;
        }

        #starsCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none !important;
            z-index: 0;
            image-rendering: pixelated;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .cursor-logo {
            position: fixed;
            width: 2rem;
            height: 2rem;
            pointer-events: none !important;
            z-index: 999999 !important;
            animation: spin 0.5s linear infinite;
            display: none;
            image-rendering: pixelated;
            transition: transform 0.15s ease-out;
        }

        .cursor-logo.hovered {
            transform: scale(1.45) !important;
        }

        .cursor-logo * {
            pointer-events: none !important;
            user-select: none;
        }

        @media (hover: hover) and (pointer: fine) {
            .cursor-logo {
                display: block;
            }
        }

        .background {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background-image: url('background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
            transition: transform 0.1s ease-out;
            will-change: transform;
            image-rendering: pixelated;
        }

        .background::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0.85) 100%);
        }

        .container {
            max-width: 62.5rem;
            margin: 0 auto;
            padding: 0 1.25rem;
            position: relative;
            z-index: 1;
        }

        header {
            padding: 2.5rem 0 1.5rem 0;
            text-align: center;
            position: relative;
        }

        /* Кликабельный контейнер логотипа */
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            position: relative;
            cursor: pointer;
            user-select: none;
            width: fit-content;
            margin: 0 auto;
        }

        /* Подсказка ПК при наведении на логотип */
        .logo-container .tooltip {
            position: absolute;
            top: -2.2rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.95);
            color: #ffffff;
            padding: 0.4rem 0.75rem;
            border: 0.125rem solid var(--accent-color);
            font-size: 0.85rem;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s ease;
            z-index: 1000;
            pointer-events: none;
        }

        .logo-container:hover .tooltip {
            opacity: 1;
            visibility: visible;
        }

        /* Неброская постоянная подсказка для телефона */
        .mobile-logo-hint {
            display: none;
            font-size: 0.75rem;
            color: #888888;
            font-family: 'uvKits', sans-serif !important;
            letter-spacing: 0.05rem;
            margin-top: -0.2rem;
            opacity: 0.75;
        }

        .logo-image {
            max-width: 18.75rem;
            width: 100%;
            max-height: 9.375rem;
            object-fit: contain;
            mix-blend-mode: normal;
            image-rendering: pixelated;
            filter: drop-shadow(4px 4px 0px #000000);
            transition: transform 0.2s ease;
        }

        .logo-container:hover .logo-image {
            transform: scale(1.03);
        }

        .logo-title-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 0.625rem;
        }

        .logo {
            font-size: clamp(2.2rem, 8vw, 5rem);
            font-weight: normal;
            color: var(--accent-color);
            letter-spacing: 0.3rem;
            font-family: 'uvKits', sans-serif !important;
            line-height: 1.1;
            margin: 0;
            position: relative;
            animation: retroGlitch 3s infinite alternate;
        }

        @keyframes retroGlitch {
            0%, 85% { text-shadow: 0.25rem 0.25rem 0 #000000; }
            88% {
                text-shadow: -2px 0 #ff0055, 2px 0 #00ffff, 0.25rem 0.25rem 0 #000000;
                transform: translate(-1px, 1px);
            }
            90% {
                text-shadow: 2px 0 #ff0055, -2px 0 #00ffff, 0.25rem 0.25rem 0 #000000;
                transform: translate(1px, -1px);
            }
            92% { text-shadow: 0.25rem 0.25rem 0 #000000; transform: translate(0, 0); }
            96% { opacity: 0.8; }
            100% { opacity: 1; text-shadow: 0.25rem 0.25rem 0 #000000; }
        }

        .splash-text {
            font-size: clamp(0.85rem, 2.5vw, 1.35rem);
            font-family: 'uvKits', sans-serif !important;
            color: #ffff55;
            text-shadow: 0.125rem 0.125rem 0 #000000;
            margin-top: 0.4rem;
            animation: splashPulse 0.6s infinite alternate ease-in-out;
            white-space: nowrap;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes splashPulse {
            from { transform: scale(0.98); }
            to { transform: scale(1.08); }
        }

        .tagline {
            font-size: clamp(1rem, 3vw, 1.8rem);
            color: #dddddd;
            text-shadow: 0.125rem 0.125rem 0 #000000;
            font-family: 'uvKits', sans-serif !important;
            letter-spacing: 0.05rem;
            animation: retroFlicker 4s infinite ease-in-out;
        }

        @keyframes retroFlicker {
            0%, 100% { opacity: 0.95; }
            50% { opacity: 0.8; }
            52% { opacity: 1; }
            54% { opacity: 0.75; }
            56% { opacity: 0.95; }
        }

        .content {
            padding: 1.5rem 0;
        }

        .section {
            background: rgba(0, 0, 0, 0.85);
            border: 0.25rem solid var(--accent-color);
            padding: 1.875rem;
            margin: 1.875rem 0;
            position: relative;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.9);
            transition: border-color 0.3s ease;
        }

        .section-title {
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            color: var(--accent-color);
            text-shadow: 0.1875rem 0.1875rem 0 #000000;
            margin-bottom: 1.25rem;
            text-align: center;
            border-bottom: 0.1875rem solid var(--accent-color);
            padding-bottom: 0.9375rem;
            font-family: 'uvKits', sans-serif !important;
            letter-spacing: 0.1rem;
            transition: text-shadow 0.2s ease, transform 0.2s ease, border-color 0.3s ease, color 0.3s ease;
        }

        .section-title:hover {
            text-shadow: -2px 0 #ff0055, 2px 0 #00ffff, 0.1875rem 0.1875rem 0 #000000;
        }

        /* Стили фильтров секции Медиа */
        .media-filter-bar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
            align-items: center;
        }

        .media-type-filters {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            background: rgba(0, 0, 0, 0.8);
            border: 0.125rem solid var(--accent-color);
            color: var(--accent-color);
            padding: 0.4rem 0.9rem;
            font-size: 0.95rem;
            font-family: 'uvKits', sans-serif !important;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 2px 2px 0 #000000;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--accent-color);
            color: #000000;
        }

        .media-author-filters {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 100%;
        }

        .author-chip {
            background: rgba(255, 255, 255, 0.08);
            border: 0.125rem solid var(--accent-color);
            color: #ffffff;
            padding: 0.3rem 0.7rem;
            font-size: 0.85rem;
            font-family: 'uvKits', sans-serif !important;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s ease;
        }

        .author-chip img {
            width: 1.3rem;
            height: 1.3rem;
            border: 1px solid var(--accent-color);
            image-rendering: pixelated;
        }

        .author-chip:hover, .author-chip.active {
            background: var(--accent-color);
            color: #000000;
        }

        .author-chip.active img {
            border-color: #000000;
        }

        .media-grid {
            display:
