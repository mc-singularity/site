name: Update YouTube & Twitch Media JSON

on:
  schedule:
    # Автоматический запуск каждые 6 часов
       - cron: '23 * * * *'
  workflow_dispatch: # Возможность запустить вручную через вкладку Actions

jobs:
  update-media:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем файлы репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Настраиваем окружение Node.js (актуальная версия 22)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. Запускаем JS скрипт с передачей секретных ключей
      - name: Run media updater script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: node update_media.js

      # 4. Проверяем изменения, синхронизируем с веткой main и отправляем обновленный media.json
      - name: Commit and push updated media.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add media.json
          if git diff --staged --quiet; then
            echo "Изменений в media.json нет."
          else
            git commit -m "Auto-update media.json via YouTube & Twitch API [skip ci]"
            git pull --rebase origin main
            git push
          fi
